name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check OpenCode companion syntax
        run: node --check opencode/index.js && node --check opencode/tui.js

      - name: Check tmux entrypoint syntax
        run: |
          bash -n tmux-enhance.tmux scripts/install-binary.sh
          test "$(TMUX_ENHANCE_SYSTEM=Linux TMUX_ENHANCE_MACHINE=x86_64 scripts/install-binary.sh --print-target)" = x86_64-unknown-linux-musl
          test "$(TMUX_ENHANCE_SYSTEM=Linux TMUX_ENHANCE_MACHINE=aarch64 scripts/install-binary.sh --print-target)" = aarch64-unknown-linux-musl
          test "$(TMUX_ENHANCE_SYSTEM=Darwin TMUX_ENHANCE_MACHINE=x86_64 scripts/install-binary.sh --print-target)" = x86_64-apple-darwin
          test "$(TMUX_ENHANCE_SYSTEM=Darwin TMUX_ENHANCE_MACHINE=arm64 scripts/install-binary.sh --print-target)" = aarch64-apple-darwin

      - name: Check release version
        run: test "$(tr -d '[:space:]' < VERSION)" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"

      - name: Build release binary
        run: cargo build --locked --release
