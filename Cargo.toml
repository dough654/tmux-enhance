[package]
name = "tmux-enhance"
version = "0.1.4"
edition = "2024"
description = "Telescope-style navigation, Harpoon-style session marks, and agent awareness for tmux"
license = "MIT"
repository = "https://github.com/dough654/tmux-enhance"
homepage = "https://github.com/dough654/tmux-enhance"
readme = "README.md"
keywords = ["tmux", "terminal", "tui", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
ansi-to-tui = { version = "8.0.1", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
fuzzy-matcher = "0.3.7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
