[package]
name = "tmux-enhance"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = { version = "8.0.1", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
fuzzy-matcher = "0.3.7"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
unicode-width = "0.2.2"
